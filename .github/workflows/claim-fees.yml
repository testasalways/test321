name: Claim fees

on:
  schedule:
    - cron: '0 10 * * 1'

  workflow_dispatch:

jobs:
  claim-protocol-fees:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEFAULT_RPC: ${{ secrets.DEFAULT_RPC }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ secrets.GOR_BOT_REPO_URL }}
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: yarn cache
        uses: actions/cache@v5
        id: yarn-cache
        with:
          path: ~/.cache/yarn
          key: fees-yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            fees-yarn-${{ runner.os }}-

      - name: yarn install
        run: yarn install --frozen-lockfile

      - name: claim
        run: |
          set -eo pipefail

          # On any failure below, alert Telegram and fail the pipeline (preserving the exit code).
          JOB_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          notify_failure() {
            status=$?
            yarn notify:telegram "⚠️ <b>Claim fees pipeline failed</b> — a step exited ${status}. <a href=\"${JOB_URL}\">View run</a>" || true
            exit "$status"
          }
          trap notify_failure ERR

          yarn pools:all
          yarn donation:baseline
          yarn claim:fees:damm
          yarn claim:fees:clmm
          yarn claim:fees:dbc
          yarn swap:all-to-gor

          # 25% of everything gained since the baseline (claimed COOK + tokens swapped to COOK).
          COOKIEJAR_DONATION_PERCENTAGE="25"
          COOKIEJAR_DONATION_AMOUNT="$(yarn --silent donation:amount "$COOKIEJAR_DONATION_PERCENTAGE")"
          COOKIEJAR_DONATION_MEMO="CookieBox Treasury Contribution (${COOKIEJAR_DONATION_PERCENTAGE}%) - $(date +%F)"

          if [ "$COOKIEJAR_DONATION_AMOUNT" = "0" ]; then
            echo "Nothing claimed this run — skipping donation."
            yarn notify:telegram "CookieBox → Cookie Jar donation: <b>0 COOK</b> (nothing claimed this run)"
          else
            COOKIEJAR_DONATION_TX="$(yarn --silent send:cook "$COOKIEJAR_PUBLIC_ADDRESS" "$COOKIEJAR_DONATION_AMOUNT" "$COOKIEJAR_DONATION_MEMO")"
            COOKIEJAR_DONATION_MSG="$(printf '<a href="https://cookiescan.io/tx/%s">View transaction on Cookiescan</a>\nCookieJar contribution: <b>%s COOK</b> (%s%%) to %s' "$COOKIEJAR_DONATION_TX" "$COOKIEJAR_DONATION_AMOUNT" "$COOKIEJAR_DONATION_PERCENTAGE" "$COOKIEJAR_PUBLIC_ADDRESS")"
            yarn notify:telegram "$COOKIEJAR_DONATION_MSG"
          fi
        env:
          RPC_URL: ${{ secrets.DEFAULT_RPC }}
          COOK_OPERATOR_LIVE_JSON: ${{ secrets.COOK_OPERATOR_LIVE_JSON }}
          COOK_TREASURY_LIVE_JSON: ${{ secrets.COOK_TREASURY_LIVE_JSON }}
          COOKIEJAR_PUBLIC_ADDRESS: ${{ secrets.COOKIEJAR_PUBLIC_ADDRESS }}
          GORBAGANA_WALLET_PRIVATE_KEY: ${{ secrets.COOK_TREASURY_LIVE_JSON }}
