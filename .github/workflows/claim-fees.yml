name: Claim fees

on:
  schedule:
    - cron: '0 10 * * 1'

  workflow_dispatch:

jobs:
  claim-protocol-fees:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEFAULT_RPC: ${{ secrets.DEFAULT_RPC }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ secrets.GOR_BOT_REPO_URL }}
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: yarn cache
        uses: actions/cache@v5
        id: yarn-cache
        with:
          path: ~/.cache/yarn
          key: fees-yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            fees-yarn-${{ runner.os }}-

      - name: yarn install
        run: yarn install --frozen-lockfile

      - name: claim
        run: |
          yarn donation:baseline
          yarn claim:fees:damm || true
          yarn claim:fees:clmm || true
          yarn claim:fees:dbc || true
          yarn swap:all-to-gor

          # 25% of everything gained since the baseline (claimed COOK + tokens swapped to COOK).
          COOKIEJAR_DONATION_PERCENTAGE="25"
          COOKIEJAR_DONATION_AMOUNT="$(yarn --silent donation:amount "$COOKIEJAR_DONATION_PERCENTAGE")"
          COOKIEJAR_DONATION_MEMO="CookieBox Treasury Contribution (${COOKIEJAR_DONATION_PERCENTAGE}%) - $(date +%F)"

          if [ "$cookiejar_donation_amount" = "0" ]; then
            echo "Nothing claimed this run — skipping donation."
          else
            yarn send:cook "$COOKIEJAR_PUBLIC_ADDRESS" "$COOKIEJAR_DONATION_AMOUNT" "$COOKIEJAR_DONATION_MEMO"
          fi
        env:
          RPC_URL: ${{ secrets.DEFAULT_RPC }}
          COOK_OPERATOR_LIVE_JSON: ${{ secrets.COOK_OPERATOR_LIVE_JSON }}
          COOK_TREASURY_LIVE_JSON: ${{ secrets.COOK_TREASURY_LIVE_JSON }}
          COOKIEJAR_PUBLIC_ADDRESS: ${{ secrets.COOKIEJAR_PUBLIC_ADDRESS }}
          GORBAGANA_WALLET_PRIVATE_KEY: ${{ secrets.COOK_TREASURY_LIVE_JSON }}
