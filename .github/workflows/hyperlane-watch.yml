name: Hyperlane watch

on:
  workflow_dispatch:

  schedule:
    - cron: '7,37 * * * *'

concurrency:
  group: hyperlane-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ secrets.GOR_BOT_REPO_URL }}
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Last covered slot + programs already alerted.
      - name: restore state
        uses: actions/cache/restore@v5
        with:
          path: temp/hyperlane-watch.json
          key: hyperlane-watch-${{ github.run_id }}
          restore-keys: |
            hyperlane-watch-

      # No `yarn install`: the script only needs Node's built-in fetch.
      - run: node ./src/scripts/watch-hyperlane.js

      - name: save state
        if: success()
        uses: actions/cache/save@v5
        with:
          path: temp/hyperlane-watch.json
          key: hyperlane-watch-${{ github.run_id }}
